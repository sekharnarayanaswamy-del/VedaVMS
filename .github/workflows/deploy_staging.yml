name: Deploy to Staging (new.vedavms.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      google_sheet_csv_url:
        description: 'Google Sheet CSV Export URL (Leave empty to use repository secret or data/vedavms_documents.csv)'
        required: false
        type: string
  repository_dispatch:
    types: [deploy_staging, google_sheet_update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_FTP_SERVER: ${{ secrets.PROD_FTP_SERVER || secrets.FTP_SERVER || secrets.STAGING_FTP_SERVER || vars.PROD_FTP_SERVER || vars.STAGING_FTP_SERVER || 'ftp.vedavms.in' }}
      STAGING_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME || secrets.FTP_USERNAME || secrets.STAGING_FTP_USERNAME || vars.PROD_FTP_USERNAME || vars.STAGING_FTP_USERNAME || 'vedavmsi' }}
      STAGING_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.STAGING_FTP_PASSWORD || vars.PROD_FTP_PASSWORD || vars.STAGING_FTP_PASSWORD }}
      STAGING_REMOTE_DIR: ${{ secrets.STAGING_REMOTE_DIR || vars.STAGING_REMOTE_DIR || '/public_html/new/' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Website
        env:
          INPUT_URL: ${{ github.event.inputs.google_sheet_csv_url }}
          SECRET_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          VAR_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            SHEET_URL="$INPUT_URL"
          elif [ -n "$SECRET_URL" ]; then
            SHEET_URL="$SECRET_URL"
          elif [ -n "$VAR_URL" ]; then
            SHEET_URL="$VAR_URL"
          else
            SHEET_URL="data/vedavms_documents.csv"
          fi
          echo "Generating documents using source: $SHEET_URL"
          python generate_documents.py --source-csv "$SHEET_URL"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vedavms-staging-build
          path: build/
          retention-days: 7

      - name: Prepare FTP Configuration
        id: ftp-config
        run: |
          RAW_SERVER="${{ env.STAGING_FTP_SERVER }}"
          # Strip protocol prefix (e.g. ftp://, ftps://), trailing path, port, quotes and whitespace
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z0-9\+\.\-]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]"')
          case "$CLEAN_SERVER" in
            ""|"vedavms.in"|"new.vedavms.in"|"185.151.30.169"|"www.vedavms.in")
              CLEAN_SERVER="ftp.vedavms.in"
              ;;
          esac
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

          # Sanitize remote directory path to guarantee leading and trailing slash
          RAW_DIR="${{ env.STAGING_REMOTE_DIR }}"
          CLEAN_DIR=$(echo "$RAW_DIR" | tr -d '[:space:]"')
          if [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="/public_html/new/"
          fi
          case "$CLEAN_DIR" in
            /*) ;;
            *) CLEAN_DIR="/$CLEAN_DIR" ;;
          esac
          case "$CLEAN_DIR" in
            */) ;;
            *) CLEAN_DIR="$CLEAN_DIR/" ;;
          esac
          echo "clean_dir=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Test FTP Connection and Remote Directory
        env:
          FTP_HOST: ${{ steps.ftp-config.outputs.clean_server }}
          FTP_USER: ${{ env.STAGING_FTP_USERNAME }}
          FTP_PASS: ${{ env.STAGING_FTP_PASSWORD }}
          TARGET_DIR: ${{ steps.ftp-config.outputs.clean_dir }}
        run: |
          python - << 'EOF'
          import ftplib, ssl, os, sys
          host = os.environ.get('FTP_HOST', 'ftp.vedavms.in')
          user = os.environ.get('FTP_USER', 'vedavmsi')
          pwd = os.environ.get('FTP_PASS', '')
          target_dir = os.environ.get('TARGET_DIR', '/public_html/new/')

          print(f"Connecting to FTPS host: {host}:21 as {user}...")
          if not pwd:
              print("::error::FTP Password is empty! Please check GitHub Secrets.")
              sys.exit(1)

          try:
              ftps = ftplib.FTP_TLS(timeout=20)
              ftps.connect(host, 21)
              ftps.auth()
              ftps.login(user, pwd)
              ftps.prot_p()
              print(f"FTPS login successful as {user}!")
              print("Current working directory:", ftps.pwd())
              
              print("Root directory contents:")
              ftps.cwd('/')
              lines = []
              ftps.retrlines('LIST', lines.append)
              for l in lines:
                  print("  ROOT:", l)
              
              # Also check if /new.vedavms.in exists
              for candidate in ['/new.vedavms.in', '/public_html/new.vedavms.in', '/public_html/new']:
                  try:
                      ftps.cwd(candidate)
                      print(f"Candidate directory exists: {candidate}")
                  except Exception as ce:
                      print(f"Candidate {candidate} error: {ce}")

              ftps.quit()
          except Exception as e:
              print(f"::error::FTP directory inspection failed: {e}")
              sys.exit(1)
          EOF

      - name: Deploy to Staging Web Server (FTP / SFTP)
        if: env.STAGING_FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.clean_server }}
          username: ${{ env.STAGING_FTP_USERNAME }}
          password: ${{ env.STAGING_FTP_PASSWORD }}
          server-dir: ${{ steps.ftp-config.outputs.clean_dir }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./build/

      - name: Ensure Staging Web Permissions and Verify
        env:
          FTP_HOST: ${{ steps.ftp-config.outputs.clean_server }}
          FTP_USER: ${{ env.STAGING_FTP_USERNAME }}
          FTP_PASS: ${{ env.STAGING_FTP_PASSWORD }}
          TARGET_DIR: ${{ steps.ftp-config.outputs.clean_dir }}
        run: |
          python - << 'EOF'
          import ftplib, ssl, os, urllib.request

          host = os.environ.get('FTP_HOST', 'ftp.vedavms.in')
          user = os.environ.get('FTP_USER', 'vedavmsi')
          pwd = os.environ.get('FTP_PASS', '')
          target_dir = os.environ.get('TARGET_DIR', '/public_html/new/')

          if pwd:
              try:
                  ftps = ftplib.FTP_TLS(timeout=20)
                  ftps.connect(host, 21)
                  ftps.auth()
                  ftps.login(user, pwd)
                  ftps.prot_p()
                  
                  def fix_perms(path):
                      try:
                          ftps.sendcmd(f"SITE CHMOD 755 {path}")
                      except Exception as e:
                          print(f"chmod 755 {path}: {e}")
                      
                      lines = []
                      try:
                          ftps.retrlines(f"LIST {path}", lines.append)
                      except Exception:
                          pass
                      for line in lines:
                          parts = line.split(maxsplit=8)
                          if len(parts) >= 9:
                              perms, name = parts[0], parts[8]
                              if name in ['.', '..']:
                                  continue
                              item = f"{path.rstrip('/')}/{name}"
                              if perms.startswith('d'):
                                  fix_perms(item)
                              else:
                                  try:
                                      ftps.sendcmd(f"SITE CHMOD 644 {item}")
                                  except Exception as e:
                                      print(f"chmod 644 {item}: {e}")

                  print(f"Setting permissions on {target_dir}...")
                  fix_perms(target_dir.rstrip('/'))
                  ftps.quit()
                  print("Permissions successfully updated.")
              except Exception as e:
                  print(f"Warning during permission fix: {e}")

          # Verify live staging site
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          for url in ['https://new.vedavms.in/index.html', 'https://new.vedavms.in/articles.html']:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'GitHub-Actions-CI'})
                  with urllib.request.urlopen(req, timeout=10, context=ctx) as resp:
                      print(f"::notice::Live Staging Verification: {url} -> HTTP {resp.getcode()} (length: {len(resp.read())})")
              except Exception as err:
                  print(f"::warning::Live Staging Verification for {url}: {err}")
          EOF



