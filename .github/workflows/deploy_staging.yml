name: Deploy to Staging (new.vedavms.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      google_sheet_csv_url:
        description: 'Google Sheet CSV Export URL (Leave empty to use repository secret or data/vedavms_documents.csv)'
        required: false
        type: string
  repository_dispatch:
    types: [deploy_staging, google_sheet_update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER || secrets.PROD_FTP_SERVER || secrets.FTP_SERVER || vars.STAGING_FTP_SERVER || vars.PROD_FTP_SERVER || vars.FTP_SERVER || 'ftp.vedavms.in' }}
      STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME || secrets.PROD_FTP_USERNAME || secrets.FTP_USERNAME || vars.STAGING_FTP_USERNAME || vars.PROD_FTP_USERNAME || vars.FTP_USERNAME || 'vedavmsi' }}
      STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD || secrets.PROD_FTP_PASSWORD || secrets.FTP_PASSWORD || vars.STAGING_FTP_PASSWORD || vars.PROD_FTP_PASSWORD || vars.FTP_PASSWORD }}
      STAGING_REMOTE_DIR: ${{ secrets.STAGING_REMOTE_DIR || vars.STAGING_REMOTE_DIR || '/new/' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Website
        env:
          INPUT_URL: ${{ github.event.inputs.google_sheet_csv_url }}
          SECRET_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          VAR_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            SHEET_URL="$INPUT_URL"
          elif [ -n "$SECRET_URL" ]; then
            SHEET_URL="$SECRET_URL"
          elif [ -n "$VAR_URL" ]; then
            SHEET_URL="$VAR_URL"
          else
            SHEET_URL="data/vedavms_documents.csv"
          fi
          echo "Generating documents using source: $SHEET_URL"
          python generate_documents.py --source-csv "$SHEET_URL"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vedavms-staging-build
          path: build/
          retention-days: 7

      - name: Prepare FTP Configuration
        id: ftp-config
        run: |
          RAW_SERVER="${{ env.STAGING_FTP_SERVER }}"
          # Strip protocol prefix (e.g. ftp://, ftps://), trailing path, port, quotes and whitespace
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z0-9\+\.\-]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]"')
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "185.151.30.169" ]; then
            CLEAN_SERVER="ftp.vedavms.in"
          fi
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

          # Sanitize remote directory path to guarantee leading and trailing slash
          RAW_DIR="${{ env.STAGING_REMOTE_DIR }}"
          CLEAN_DIR=$(echo "$RAW_DIR" | tr -d '[:space:]"')
          if [ -z "$CLEAN_DIR" ]; then
            CLEAN_DIR="/new/"
          fi
          case "$CLEAN_DIR" in
            /*) ;;
            *) CLEAN_DIR="/$CLEAN_DIR" ;;
          esac
          case "$CLEAN_DIR" in
            */) ;;
            *) CLEAN_DIR="$CLEAN_DIR/" ;;
          esac
          echo "clean_dir=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Deploy to Staging Web Server (FTP / SFTP)
        if: env.STAGING_FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.clean_server }}
          username: ${{ env.STAGING_FTP_USERNAME }}
          password: ${{ env.STAGING_FTP_PASSWORD }}
          server-dir: ${{ steps.ftp-config.outputs.clean_dir }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./build/



