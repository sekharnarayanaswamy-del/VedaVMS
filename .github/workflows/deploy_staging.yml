name: Deploy to Staging (new.vedavms.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      google_sheet_csv_url:
        description: 'Google Sheet CSV Export URL (Leave empty to use repository secret or data/vedavms_documents.csv)'
        required: false
        type: string
  repository_dispatch:
    types: [deploy_staging, google_sheet_update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_FTP_SERVER: ${{ secrets.PROD_FTP_SERVER || secrets.FTP_SERVER || secrets.STAGING_FTP_SERVER || vars.PROD_FTP_SERVER || vars.STAGING_FTP_SERVER || 'ftp.vedavms.in' }}
      STAGING_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME || secrets.FTP_USERNAME || secrets.STAGING_FTP_USERNAME || vars.PROD_FTP_USERNAME || vars.STAGING_FTP_USERNAME || 'vedavmsi' }}
      STAGING_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD || secrets.FTP_PASSWORD || secrets.STAGING_FTP_PASSWORD || vars.PROD_FTP_PASSWORD || vars.STAGING_FTP_PASSWORD }}
      STAGING_REMOTE_DIR: ${{ secrets.STAGING_REMOTE_DIR || vars.STAGING_REMOTE_DIR || '/public_html/new/' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Website
        env:
          INPUT_URL: ${{ github.event.inputs.google_sheet_csv_url }}
          SECRET_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          VAR_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            SHEET_URL="$INPUT_URL"
          elif [ -n "$SECRET_URL" ]; then
            SHEET_URL="$SECRET_URL"
          elif [ -n "$VAR_URL" ]; then
            SHEET_URL="$VAR_URL"
          else
            SHEET_URL="data/vedavms_documents.csv"
          fi
          echo "Generating documents using source: $SHEET_URL"
          python generate_documents.py --source-csv "$SHEET_URL"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vedavms-staging-build
          path: build/
          retention-days: 7

      - name: Prepare FTP Configuration
        id: ftp-config
        run: |
          RAW_SERVER="${{ env.STAGING_FTP_SERVER }}"
          # Strip protocol prefix (e.g. ftp://, ftps://), trailing path, port, quotes and whitespace
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z0-9\+\.\-]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]"')
          case "$CLEAN_SERVER" in
            ""|"vedavms.in"|"new.vedavms.in"|"185.151.30.169"|"www.vedavms.in")
              CLEAN_SERVER="ftp.vedavms.in"
              ;;
          esac
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

          # Sanitize remote directory path to guarantee leading and trailing slash
          RAW_DIR="${{ env.STAGING_REMOTE_DIR }}"
          CLEAN_DIR=$(echo "$RAW_DIR" | tr -d '[:space:]"')
          case "$CLEAN_DIR" in
            ""|"/httpdocs"*|"httpdocs"*|*"/httpdocs"*)
              CLEAN_DIR="/public_html/new/"
              ;;
          esac
          case "$CLEAN_DIR" in
            /*) ;;
            *) CLEAN_DIR="/$CLEAN_DIR" ;;
          esac
          case "$CLEAN_DIR" in
            */) ;;
            *) CLEAN_DIR="$CLEAN_DIR/" ;;
          esac
          echo "clean_dir=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Deploy to Staging Web Server (/public_html/new/)
        env:
          FTP_HOST: ${{ steps.ftp-config.outputs.clean_server }}
          FTP_USER: ${{ env.STAGING_FTP_USERNAME }}
          FTP_PASS: ${{ env.STAGING_FTP_PASSWORD }}
          TARGET_DIR: ${{ steps.ftp-config.outputs.clean_dir }}
        run: |
          python - << 'EOF'
          import ftplib, ssl, os, sys, urllib.request

          host = os.environ.get('FTP_HOST', 'ftp.vedavms.in')
          user = os.environ.get('FTP_USER', 'vedavmsi')
          pwd = os.environ.get('FTP_PASS', '')
          target_dir = '/public_html/new'

          if not pwd:
              print("::error::FTP password is empty!")
              sys.exit(1)

          try:
              ftps = ftplib.FTP_TLS(timeout=30)
              ftps.connect(host, 21)
              ftps.auth()
              ftps.login(user, pwd)
              ftps.prot_p()
              print(f"Connected to FTPS host {host} as {user}")

              def remove_remote_dir_recursive(path):
                  print(f"Purging remote path: {path}")
                  try:
                      ftps.cwd(path)
                      items = []
                      ftps.retrlines("LIST", items.append)
                      for line in items:
                          parts = line.split(maxsplit=8)
                          if len(parts) >= 9:
                              perms, name = parts[0], parts[8]
                              if name in ['.', '..']:
                                  continue
                              item_path = f"{path.rstrip('/')}/{name}"
                              if perms.startswith('d'):
                                  remove_remote_dir_recursive(item_path)
                                  try:
                                      ftps.cwd(path)
                                  except Exception:
                                      pass
                              else:
                                  try:
                                      ftps.delete(name)
                                      print(f"  Deleted file: {item_path}")
                                  except Exception as fe:
                                      print(f"  Failed deleting file {item_path}: {fe}")
                      ftps.cwd('/')
                      ftps.rmd(path)
                      print(f"Successfully deleted directory: {path}")
                  except Exception as e:
                      print(f"Notice on {path}: {e}")
                      try:
                          ftps.cwd('/')
                          ftps.rmd(path)
                          print(f"Direct rmd succeeded for {path}")
                      except Exception as e2:
                          pass

              # Purge any legacy /httpdocs or discovery folders
              for obsolete in ['/httpdocs', '/public_html/httpdocs', '/new.vedavms.in', '/public_html/new.vedavms.in']:
                  remove_remote_dir_recursive(obsolete)

              print(f"\n--- Deploying exclusively to Target Directory: {target_dir} ---")
              parts = [p for p in target_dir.strip('/').split('/') if p]
              curr = ""
              for part in parts:
                  curr += "/" + part
                  try:
                      ftps.cwd(curr)
                  except Exception:
                      try:
                          ftps.mkd(curr)
                          ftps.cwd(curr)
                          ftps.sendcmd(f"SITE CHMOD 755 {curr}")
                          print(f"Created directory: {curr}")
                      except Exception as e:
                          print(f"Directory {curr} notice: {e}")

              # Upload all build files
              for root, dirs, files in os.walk('build'):
                  rel_dir = os.path.relpath(root, 'build').replace('\\', '/')
                  target_sub = target_dir if rel_dir == '.' else f"{target_dir}/{rel_dir}"
                  for d in dirs:
                      try:
                          ftps.mkd(f"{target_sub}/{d}")
                          ftps.sendcmd(f"SITE CHMOD 755 {target_sub}/{d}")
                      except Exception:
                          pass
                  for f in files:
                      local_f = os.path.join(root, f)
                      remote_f = f"{target_sub}/{f}"
                      with open(local_f, 'rb') as fp:
                          ftps.storbinary(f"STOR {remote_f}", fp)
                      try:
                          ftps.sendcmd(f"SITE CHMOD 644 {remote_f}")
                      except Exception:
                          pass

              ftps.sendcmd(f"SITE CHMOD 755 {target_dir}")
              ftps.quit()
              print(f"Staging deployment to {target_dir} successfully completed.")
          except Exception as e:
              print(f"::error::Staging deployment failed: {e}")
              sys.exit(1)

          # Live Verification
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }
          for url in ['https://new.vedavms.in/index.html', 'https://new.vedavms.in/']:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10, context=ctx) as resp:
                      body = resp.read().decode('utf-8', errors='ignore')
                      print(f"::notice::Live Staging Verification: {url} -> HTTP {resp.getcode()} (length: {len(body)})")
              except Exception as err:
                  print(f"::warning::Live Staging Verification for {url}: {err}")
          EOF



