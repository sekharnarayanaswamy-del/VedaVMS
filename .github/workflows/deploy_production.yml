name: Deploy to Production (vedavms.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      catalog_version:
        description: 'Catalog Semantic Version (e.g. 2.5.1, leave empty to use data/version.txt)'
        required: false
        default: ''
        type: string
      target_dir:
        description: 'Target Remote Directory on Web Server'
        required: true
        default: '/public_html/'
        type: string
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm live production rollout'
        required: true
        default: 'DEPLOY'
        type: string
  repository_dispatch:
    types: [deploy_production, google_sheet_production_deploy]

permissions:
  contents: write

jobs:
  promote-to-production:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'DEPLOY') ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[prod]') ||
        contains(github.event.head_commit.message, '[production]') ||
        contains(github.event.head_commit.message, '[deploy:prod]') ||
        contains(github.event.head_commit.message, 'prod:')
      ))
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROD_FTP_SERVER: ${{ secrets.PROD_FTP_SERVER || secrets.STAGING_FTP_SERVER || secrets.FTP_SERVER || vars.PROD_FTP_SERVER || 'ftp.vedavms.in' }}
      PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME || secrets.STAGING_FTP_USERNAME || secrets.FTP_USERNAME || vars.PROD_FTP_USERNAME || 'vedavmsi' }}
      PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD || secrets.STAGING_FTP_PASSWORD || secrets.FTP_PASSWORD || vars.PROD_FTP_PASSWORD || vars.STAGING_FTP_PASSWORD }}
      PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR || github.event.client_payload.target_dir || github.event.inputs.target_dir || '/public_html/' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify FTP Credentials
        run: |
          if [ -z "${{ env.PROD_FTP_SERVER }}" ]; then
            echo "::warning::PROD_FTP_SERVER is missing. Defaulting to ftp.vedavms.in"
          fi
          if [ -z "${{ env.PROD_FTP_PASSWORD }}" ]; then
            echo "::error::PROD_FTP_PASSWORD / STAGING_FTP_PASSWORD secret is missing! Please configure secrets in GitHub Secrets."
            exit 1
          fi
          echo "FTP credentials and host verified (${{ env.PROD_FTP_SERVER }})."

      - name: Generate Website Bundle
        id: generate-site
        env:
          INPUT_URL: ${{ github.event.inputs.google_sheet_csv_url }}
          INPUT_VERSION: ${{ github.event.inputs.catalog_version || github.event.client_payload.catalog_version }}
          SECRET_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          VAR_URL: ${{ vars.GOOGLE_SHEET_CSV_URL }}
        run: |
          if [ -n "$SECRET_URL" ]; then
            SHEET_URL="$SECRET_URL"
          elif [ -n "$INPUT_URL" ]; then
            SHEET_URL="$INPUT_URL"
          elif [ -n "$VAR_URL" ]; then
            SHEET_URL="$VAR_URL"
          else
            SHEET_URL="data/vedavms_documents.csv"
          fi
          
          VER_ARG=""
          if [ -n "$INPUT_VERSION" ]; then
            VER_ARG="--catalog-version $INPUT_VERSION"
          fi
          
          echo "Generating website from: $SHEET_URL (version: ${INPUT_VERSION:-auto})"
          python generate_documents.py --source-csv "$SHEET_URL" $VER_ARG
          
          CURR_VER=$(tr -d ' \r\n' < data/version.txt 2>/dev/null || echo "2.5.0")
          echo "current_version=$CURR_VER" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vedavms-production-build
          path: build/
          retention-days: 14

      - name: Prepare FTP Configuration
        id: ftp-config
        run: |
          RAW_SERVER="${{ env.PROD_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[a-zA-Z0-9\+\.\-]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]"')
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "185.151.30.169" ]; then
            CLEAN_SERVER="ftp.vedavms.in"
          fi
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

          # Sanitize remote directory path to guarantee leading and trailing slash
          RAW_DIR="${{ env.PROD_REMOTE_DIR }}"
          CLEAN_DIR=$(echo "$RAW_DIR" | tr -d '[:space:]"')
          case "$CLEAN_DIR" in
            ""|"/httpdocs"*|"httpdocs"*|*"/httpdocs"*)
              CLEAN_DIR="/public_html/"
              ;;
          esac
          case "$CLEAN_DIR" in
            /*) ;;
            *) CLEAN_DIR="/$CLEAN_DIR" ;;
          esac
          case "$CLEAN_DIR" in
            */) ;;
            *) CLEAN_DIR="$CLEAN_DIR/" ;;
          esac
          echo "clean_dir=$CLEAN_DIR" >> $GITHUB_OUTPUT

      - name: Deploy to Production Web Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.clean_server }}
          username: ${{ env.PROD_FTP_USERNAME }}
          password: ${{ env.PROD_FTP_PASSWORD }}
          server-dir: ${{ steps.ftp-config.outputs.clean_dir }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./build/

      - name: Tag Release & Update Version in Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_VER: ${{ steps.generate-site.outputs.current_version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain data/version.txt)" ]; then
            git add data/version.txt
            git commit -m "chore(release): bump catalog version to v$CATALOG_VER [skip ci]"
            git push origin main || true
          fi
          
          TAG_NAME="v$CATALOG_VER"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Production Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
            echo "Created git tag: $TAG_NAME"
          fi
